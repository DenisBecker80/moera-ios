name: MoeraClient
options:
  bundleIdPrefix: org.moera.client
  deploymentTarget:
    iOS: "17.0"
targets:
  MoeraClient:
    type: application
    platform: iOS
    sources: [MoeraClient]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.moera.client.ios
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Moera
